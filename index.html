y visibility"},{name:"Forecasting Engine",description:"Weighted linear regression to project liquidity/cash positions (up to ~7 years).",impact:"Data-driven financial planning"}],impact:["5 major business modules shipped to production","Tight integration proving platform architecture","Odoo-level features with custom enhancements"]},"ace-vault":{id:"ace-vault",title:"ACE Password Vault",tech:["C++",".NET","OpenSSL","AES-256","RSA-4096"],summary:"Multi-layered encryption system with custom cryptographic protocols exceeding industry standards.",description:"Financial credentials demanded security beyond standard password managers — and years of ethical hacking gave me the perspective to design it right. Built a defense-in-depth architecture with custom auditing and key rotation.",descriptionAce:"Financial credentials demanded security beyond standard password managers — and years of ethical hacking gave me the perspective to design it right. Built a defense-in-depth architecture with custom auditing and key rotation, drawing on the same security-first mindset I developed being H4ck3R_777.",category:"Security • Cryptography",challenge:"Storing sensitive financial credentials required higher security than off-the-shelf solutions. Needed custom auditing, key rotation, and compliance with internal policies.",approach:"Designed multi-layered security: inner loops use C++ for raw cryptographic operations via OpenSSL wrappers; outer layers use .NET for secure memory management and PWA interface. Implemented zero-knowledge principles.",approachAce:"Designed multi-layered security: inner loops use C++ for raw cryptographic operations via OpenSSL wrappers; outer layers use .NET for secure memory management and PWA interface. Implemented zero-knowledge principles where applicable.",impact:["Became critical company infrastructure","Set new internal security standards","Zero security incidents since deployment","Protected most sensitive credentials"],link:"#",isFlagship:!0,isAceProject:!0,typeAce:"Security • Cryptography",periodAce:"2023"},"external-partner-integrations":{id:"external-partner-integrations",title:"External Partner Integrations",tech:[".NET","REST APIs","SOAP","OAuth2","HMAC"],summary:"Integrated major payment partners including Mastercard, HBL, and PNB with robust, secure payment flows.",description:"Delivered bank partner integrations engineering resilient adapters, retries, idempotency, and observability. Extensive experience consuming external services via well-typed client libraries and SLA-aware timeouts.",isAceProject:!0,typeAce:"Integrations • API",periodAce:"2023 — Present",partners:["Mastercard","HBL (Habib Bank Limited)","PNB (Punjab National Bank, India)"],impact:["Highly praised by Mastercard team for implementation quality","Robust error handling and retry mechanisms","Complete observability and monitoring"]},"real-time-infrastructure":{id:"real-time-infrastructure",title:"Real-time Infrastructure",tech:["SignalR",".NET","WebSockets","Redis"],summary:"Established SignalR infrastructure for notifications and real-time features across ERP.",description:"Built real-time communication layer including connection lifecycle, delivery semantics, and scale considerations. Applied RPC concepts within event-driven systems.",isAceProject:!0,typeAce:"Infrastructure • SignalR",periodAce:"2024",impact:["Live notifications across all ERP modules","Reliable delivery with fallback mechanisms","Scalable architecture for future growth"]},"background-jobs-framework":{id:"background-jobs-framework",title:"Background Jobs Framework",tech:[".NET 10","Background Services","Channels","PostgreSQL"],summary:"Unbreakable jobs management system adopted across multiple projects to solve a long-standing infrastructure gap.",description:"First introduced in EMS as a personal engineering necessity, this framework proved so robust and reliable at launch that other teams — facing persistent job management issues — ported my module to handle their background processing. I unknowingly solved a long-standing problem that ACE's infrastructure badly needed.",isAceProject:!0,typeAce:"Infrastructure • Core",periodAce:"2024 — Present",architecturalHighlights:["Composable job definitions with dependency injection","Configurable retry policies with exponential backoff","Dead-letter handling for failed jobs with investigation support","Graceful shutdown with job state preservation","Health monitoring and observability built-in","Zero job loss guarantee even during deployments"],impact:["Unbreakable since launch — zero job failures","Adopted by 3+ other projects facing job management issues","Solved a long-standing infrastructure problem across ACE","Became the de-facto standard for background processing"]},"logging-framework":{id:"logging-framework",title:"Logging Framework",tech:[".NET","Source Generators","Structured Logging","Serilog"],summary:"Pluggable logging framework providing in-depth, readable logs with configurable verbosity and investigative context.",description:"Engineered a comprehensive logging framework in the most .NET-optimized way possible. Designed to be pluggable to any project, providing readable and configurable logs with adjustable verbosity levels.",isAceProject:!0,typeAce:"Infrastructure • Observability",periodAce:"2024 — Present",architecturalHighlights:["Pluggable architecture — drop into any .NET project","Configurable verbosity levels (Trace → Critical)","Structured logging with semantic context","Readable formatting for human investigation","Full stack traces with source file references","Performance-optimized using source generators"],impact:["Standardized logging across multiple ACE projects","Reduced debugging time with clear investigation paths","Configurable verbosity prevents log noise in production","Adopted alongside Background Jobs Framework"]},"apple-mdm":{id:"apple-mdm",title:"Apple MDM Platform",tech:[".NET 10","React","nanoMDM","microMDM","SCEP","Apple MDM"],summary:"Company-wide Apple device management platform — a .NET 10 orchestrator commanding open-source MDM microservices, targeting 1,000+ devices.",description:"What began as a monitoring enhancement inside the Employee Monitoring Suite revealed itself as a much bigger world. Months of deep research into Apple's MDM ecosystem — the entire device lifecycle, from initial configuration to maximum controllability — grew into a standalone platform: a .NET 10 backend orchestrating dedicated open-source MDM microservices (nanoMDM, microMDM, and SCEP for certificate enrollment), fronted by a custom-built React control panel.",descriptionAce:"A direct initiative, undertaken in collaboration with the CEO, the CTO, the accounting team, and the monitoring team. Originating as a superior monitoring and hardware-access-restriction effort within the Employee Monitoring Suite, it grew into a standalone device-management platform after months of research into Apple's MDM ecosystem — securing the necessary rights and subscriptions and mastering the full lifecycle through iterative trial and error. A .NET 10 orchestrator commands open-source MDM services (nanoMDM, microMDM, and SCEP certificate enrollment), while a custom React server UI delivers a polished, colorful experience inspired by shadcn/ui — without compromising design principles. Slated for company-wide rollout across 1,000+ devices in early 2027, following complete testing, verification, compliance checks, and audits.",category:"Infrastructure • Device Management",challenge:"Superior monitoring and restricted access to hardware and the operating system could not be achieved by in-house tooling alone. The company adopted Apple's own MDM stack as the foundation — but standing it up meant mastering an entire unfamiliar ecosystem: enrollment flows, certificates, subscriptions, and compliance requirements.",approach:"Spent months researching every aspect of Apple's MDM lifecycle — from zero configuration to maximum controllability — gathering resources, securing the necessary rights and subscriptions, and validating every assumption through trial and error. Architected a .NET 10 backend as the single control plane orchestrating open-source MDM microservices, and designed a custom React server UI: shadcn/ui-inspired, more colorful, design principles uncompromised.",architecturalHighlights:[".NET 10 orchestrator as the single control plane over open-source MDM microservices","nanoMDM, microMDM, and SCEP services composed into one coherent platform","Full Apple MDM lifecycle support — from initial configuration to maximum controllability","Hardware- and OS-level access restriction for company devices","Custom React server UI — shadcn/ui-inspired, more colorful, design principles uncompromised","Staged rollout gated by testing, verification, compliance checks, and audits"],impact:["Direct initiative spanning the CEO, CTO, accounting, and monitoring teams","Months of research distilled into end-to-end MDM lifecycle mastery","Production rollout targeted for early 2027 across 1,000+ company devices","Standalone platform born from within the Employee Monitoring Suite"],link:"#",isFlagship:!0,isAceProject:!0,typeAce:"Infrastructure • Device Management",periodAce:"Mid 2026 — Early 2027"},"reporting-engine":{id:"reporting-engine",title:"Unified Reporting Engine",tech:["Python 3.14","Jupyter Kernel","Google Gemini API","Graph Schemas (DAG)","Pytest","FastAPI","ReportLab","OpenPyXL","Pandas"],summary:"Python-based microservice that replaced years of fragmented, per-project reporting with a single, zero-overhead solution — now evolved into an AI-augmented analytics platform with embedded Jupyter notebooks, Gemini-powered code generation, graph-based schema inheritance, and 3,000+ automated tests.",description:"Every project at ACE handled reporting independently — brittle, unreliable, non-customizable. I proposed and solely built a microservice reporting engine in Python 3.14, leveraging its rich library ecosystem. The design philosophy: expose underlying library APIs directly with zero wrapper overhead. Over time, I evolved it far beyond its original scope — orchestrating an embedded Jupyter Notebook environment inside the ERP, integrating Google Gemini endpoints for on-the-fly Python script generation (inspired by Google Colab), engineering a graph-based schema definition model to eliminate cross-module duplication, adding frequency-based audit snapshots, and hardening everything with a 3,000+ test case suite. The need for dynamic, visual query construction during this project also gave birth to SchemaFlow — now an open-source standalone tool.",descriptionAce:`ACE had a years-long, company-wide reporting problem: every project — EMS, ERP, Laravel-based services, and more — handled reporting independently, resulting in brittle, unreliable, and non-customizable implementations. I proposed a microservice-based architecture with Python 3.14 as the primary reporting engine, leveraging its rich library ecosystem for flexible report generation and data presentation. I solely developed the engine (since nobody had specialization in polyglot application development), keeping the implementation minimal by design — exposing the underlying library APIs directly, requiring zero overhead for maintenance or custom development. Over time, I evolved the engine into a full-scale analytics workspace: orchestrating a Jupyter Notebook runtime directly inside the ERP for custom Python analytics with notebook persistence, sharing, and curated financial visualization presets. Integrated Google Gemini API endpoints for on-the-fly Python code generation inspired by Google Colab's generative workflows. Transitioned from rigid JSON schemas to a directed graph schema architecture enabling dataset inheritance — a massive time saver for the accounting team. Added frequency-based snapshot persistence for strict financial audits. I led the engineering and architecture, with implementation workloads steered through Claude Fable and GPT-6 Astra flagship models. As a live demonstration of this methodology, I orchestrated specialist agent squads — frontend, backend, database-schema, and data specialists — that coordinated to piece together each major module's bigger picture and the shape of its data, then synthesized the JSON schemas for the reporting presets (spanning Budget Management with multi-currency and distribution engines, and the entire Procurement lifecycle) with incredible precision, and authored a 3,000+ test suite to guarantee unbreakable reliability. The engine is now integrated across EMS, ERP, and multiple Laravel-based projects, becoming ACE's internal industry standard. The accounting team, the treasury team, their heads, managers, our manager, the CEO, and the CTO all praised the reporting engine, calling it a "marvel of engineering" and a true feat of engineering at ACE. The need for dynamic, visual query construction during this project also gave birth to SchemaFlow — now an open-source standalone tool.`,category:"Microservice • Polyglot",challenge:"Years of fragmented reporting across 5+ services and projects — each with its own brittle, badly designed, rigid implementation. Inconsistent outputs, unmaintainable code, and no customization support. Financial teams needed dynamic ad-hoc analytics, strict audit trails, and bespoke visualizations but were blocked by slow engineering release cycles.",approach:"Designed a language-agnostic microservice consumed via REST. Chose Python 3.14 for its unmatched library ecosystem (ReportLab, OpenPyXL, Pandas, Jinja2). Kept the implementation minimal — the API surface mirrors the underlying libraries directly, requiring zero maintenance overhead for new report types. Polyglot integration ensures .NET, Angular, and Laravel projects consume it seamlessly. Later evolved the architecture with an embedded Jupyter Notebook workspace inside the ERP, Google Gemini endpoints for natural-language-to-Python generation, a directed graph schema engine for composable, inheritable datasets, immutable audit snapshots, and a 3,000+ test case test harness.",impact:["Solved a years-long company-wide problem","Replaced 5+ independent brittle implementations","Became ACE's internal standard for reporting","Zero maintenance overhead via direct API design",`Praised by Accounting, Treasury, Managers, CEO, and CTO as a "marvel of engineering" and ACE's greatest engineering feat`,"3,000+ automated test suite guaranteeing production reliability and zero regressions","Demonstrated enterprise-grade polyglot engineering"],link:"#",isFlagship:!0,isAceProject:!0,featured:!0,typeAce:"Microservice • Polyglot",periodAce:"2025 — Present",modules:[{name:"Embedded Jupyter Notebook Runtime",description:"Orchestrated interactive Python/Jupyter kernel execution directly inside the ERP interface. Features notebook persistence, workspace sharing, and execution sandboxing.",impact:"Enabled financial teams to run bespoke Python analytics without local environments"},{name:"Gemini AI Script & Query Generation",description:"Integrated Google Gemini endpoints inspired by Google Colab AI workflows. Translates natural language reporting queries into validated, executable Python analysis scripts on the fly.",impact:"Accelerated complex report generation from days to seconds"},{name:"Graph-Based Schema Inheritance Engine",description:"Replaced redundant JSON schema definitions with a directed acyclic graph (DAG) schema model. Allows new reports to inherit, extend, and compose existing dataset pipelines.",impact:"Eliminated schema duplication and saved hundreds of hours for accounting"},{name:"Financial Visualization Presets",description:"Curated library of plug-and-play visual components tailored for Treasury & Accounting (cash flows, currency variance, multi-year forecasting, liquidity graphs).",impact:"Turnkey board-ready financial visualizations out of the box"},{name:"Frequency-Based Audit Snapshots",description:"Scheduled reporting engine with immutable dataset snapshots capturing point-in-time state for regulatory compliance and financial audits.",impact:"100% auditable historical financial data integrity"},{name:"3,000+ Automated Test Suite",description:"Relentless test harness exercising the execution engine, graph resolution algorithms, script sandboxing, and output renderers under high load.",impact:"Zero regressions across rapid feature expansions; rock-solid reliability"}],architecturalHighlights:["Microservice architecture — language-agnostic integration via HTTP/REST","Python 3.14 core — leveraging rich library ecosystem (ReportLab, OpenPyXL, Pandas, Jinja2)","Zero-overhead API design: exposes underlying library capabilities directly, no wrapper abstraction tax","Direct Python (Jupyter) Notebook runtime orchestration embedded inside ERP","Generative AI code pipeline using Google Gemini endpoints for instant Python script generation","Graph-based schema engine replacing JSON duplication with dataset inheritance","3,000+ comprehensive automated test suite hammering reliability, edge cases, and performance","Immutable point-in-time dataset snapshots for scheduled compliance audits","Polyglot integration — seamlessly consumed by .NET, Angular, and Laravel projects","Multi-agent implementation orchestration using Claude Fable and GPT-6 Astra flagship models","Specialist agent squads for module presets — frontend, backend, DB-schema, and data specialists coordinated to synthesize precise JSON schemas for Budget Management (multi-tenant, multi-currency, distribution engine) and Procurement lifecycle templates","Sole developer in a polyglot-first engineering approach"],techAce:["Python 3.14","Jupyter Kernel","Google Gemini API","Graph Schemas","Pytest (3,000+ Tests)","FastAPI","Pandas","ReportLab","OpenPyXL","Microservices"],impactAce:["Solved a years-long, company-wide reporting fragmentation problem","Replaced independent, brittle implementations across 5+ projects","Became ACE's internal standard for all reporting needs","Zero maintenance overhead due to direct API pass-through design",'Praised by CEO, CTO, and executive leadership as a "marvel of engineering" and greatest feat at ACE',"3,000+ automated test suite ensuring flawless stability across continuous feature additions","Pioneered in-ERP Python Jupyter notebooks with Google Gemini generative code synthesis","Graph-based dataset inheritance eliminating schema duplication and saving massive time for accounting","Demonstrated polyglot software engineering at enterprise scale","Orchestrated specialist agent squads (frontend, backend, DB-schema, data) to synthesize precise preset schemas for Budget Management and Procurement lifecycle templates"]},overwatch:{id:"overwatch",title:"Overwatch",tech:[".NET 10","C#","Blazor","Fluent UI 2","Cryptography","JSON/XML Parsers","Big Data"],summary:"Flagship service monitoring system with custom response criteria parsing and fine-grained rights management.",description:'Legacy monitoring at ACE was rigid and hardcoded—requiring custom updates for each partner. I sat down with the CEO to architect a full-scale flagship status product: Overwatch. Engineered dynamic partner onboarding with encrypted custom headers, dynamic HTTP request payloads, and an [ac]expression-based response validation engine[/ac] supporting XML/JSON (e.g., `posts[5].name <contains> "great" AND posts[0].id <equals> 1024`). Underneath, a highly optimized parser processes only the required payload segments on-demand, handling big data streams with [hi]minimal memory footprint[/hi]. Coupled with a fine-grained, button-level rights engine and an in-depth analytics dashboard supporting [hi]on-the-fly evidence verification[/hi] and direct PDF/Excel exports.',descriptionAce:"Tackled an architectural overhaul of a legacy partner-monitoring system, transforming it into a full-scale enterprise flagship product at the direct request of the CEO. Replaced hardcoded scripts with a dynamic partner onboarding engine featuring encrypted header storage, custom request/response payload configuration, and a [ac]logical expression rules engine[/ac] for validating JSON/XML responses. To support big data parsing under high load, I built a highly optimized, on-demand response parser. Also engineered a highly granular, module-agnostic rights system that controls access down to the button level, alongside an analytical dashboard that provides audit evidence down to the individual HTTP response received.",category:"Flagship • Full-Stack / Security",challenge:'The legacy "ACE Status" project was hardcoded and rigid. Every new partner service required custom code updates for request headers, payloads, authentication, and success verification logic, making scaling impossible and introducing high maintenance overhead.',approach:"Collaborated with the CEO to architect Overwatch from the ground up on modern Blazor and .NET 10. Designed a dynamic partner onboarding interface with encrypted header storage, basic/custom authentication, and on-the-fly Base URL overrides. Built a custom logical expression evaluator allowing administrators to define complex verification rules (e.g., matching XML/JSON array values using logical AND/OR blocks) with no code changes. Implemented a module-agnostic rights engine to manage user actions down to specific UI buttons, and integrated our Python-based reporting microservice for CEO-requested PDF and Excel reports.",impact:["Transformed legacy down-detector into a flagship enterprise-grade product","100% dynamic partner onboarding with zero code changes or deployments","Logical rules engine supporting complex JSON/XML response verification","Highly granular rights management controlling UI elements down to individual buttons","In-depth analytics dashboard providing complete audit evidence down to the HTTP payload"],link:"#",isFlagship:!0,isAceProject:!0,typeAce:"Flagship • Full-Stack / Security",periodAce:"2024 — Present"},"uwb-sim":{id:"uwb-sim",title:"UWB Indoor Positioning Simulation",tech:["C# 13",".NET 9","Python","NumPy","SciPy","WPF"],summary:"Sophisticated simulation engine enabling UWB deployment planning without physical hardware.",description:"Client needed to validate UWB anchor placements before expensive physical installation. My deep interest in [ac]physics[/ac] — signal propagation, electromagnetic attenuation, and computational geometry — made this a uniquely natural fit. Built a hybrid (polyglot) .NET/Python system modeling signal behavior with material-specific precision.",category:"Simulation • Research",challenge:"Deploying UWB anchors requires expensive physical testing. Mistakes in placement are costly to fix. The client needed virtual validation before drilling holes.",approach:"Built a hybrid simulation engine: .NET for UI, core logic, and geometric calculations; Python (NumPy/SciPy) for signal propagation modeling and heatmap generation. Implemented material-specific attenuation for walls, glass, and obstacles, with ToA/TDoA localization and real-time heatmaps that regenerate as nodes move.",impact:["Reduced deployment costs by approximately 60%","Compressed timeline from months to days","Simulation accuracy within 5% of physical tests","ToA/TDoA localization with on-map accuracy indicators","Delivered across five milestones with full source code, documentation, and end-user training","Exceptional client praise for attention to detail"],link:"#",isFlagship:!0,featured:!0},"mr-crypt":{id:"mr-crypt",title:"mr_crypt",tech:["C++23","OpenSSL 3.0+","Template Metaprogramming"],summary:"[ac]Revolutionary[/ac] range-like syntax for C++ cryptography reducing implementation time by [hi]10x[/hi].",description:"OpenSSL's C-API is verbose and error-prone. Created a wrapper using [ac]C++23 ranges[/ac] and [hi]template metaprogramming[/hi] for type-safe, fluent cryptographic operations.",category:"Open Source • Library",challenge:"OpenSSL's C-API requires extensive boilerplate, manual memory management, and is difficult to use safely in modern C++ projects.",approach:"Leveraged C++23 ranges and concepts to create a fluent, type-safe API. Template metaprogramming ensures compile-time safety. Seamless OpenSSL 3.0+ integration.",impact:["10x reduction in implementation boilerplate","Significant improvement in code readability","Recognition in C++ community","Active open source maintenance"],link:"https://github.com/TheMR-777/mr_crypt",isFlagship:!0,isOpenSource:!0,roleOpenSource:"Creator & Principal Engineer"},costaz:{id:"costaz",title:"Costaz Desktop",tech:["Flutter","Google Sheets API","Firebase","Excel Export"],summary:"Decentralized academic management system reducing manual data entry by 50%, built as a final year project.",description:"Built for University of the Punjab after surveying 10+ professors. Solved record management pain points with offline-first design and Google integration.",category:"Academic • FYP",challenge:"Professors struggled with fragmented record-keeping. Unreliable connectivity made cloud-only solutions impractical.",approach:"Designed offline-first architecture using Google accounts for decentralized auth. Integrated Google Sheets for familiar data handling. Excel export for report generation.",impact:["50% reduction in manual data entry","30% improvement in data accuracy","Adopted by multiple departments","Recognition for elegant architecture"],link:"#",isFlagship:!0},schemaflow:{id:"schemaflow",title:"SchemaFlow",tech:["React 19","TypeScript","React Flow","Zustand","Tailwind CSS 4","Framer Motion"],summary:"Visual, interactive query canvases.",description:"Born during the development of my Reporting Engine — I needed a way to let users visually wire up database tables and see live SQL output. What started as a stakeholder demo evolved into a standalone, open-source visual query builder. Paste your DDL, drag tables onto a canvas, connect columns, and watch the SQL write itself. Co-engineered with [hi]Gemini 3.1 Pro[/hi], and one of the projects I feel truly embodies my philosophy: take something genuinely complex [dim]in[/dim], deliver something meaningfully elegant [ac]out[/ac].",category:"Developer Tool • Visualization",origin:"Evolved from an enterprise stakeholder demo into an open-source, pluggable query builder",link:"https://themr-777.github.io/SchemaFlow/",repo:"https://github.com/TheMR-777/SchemaFlow",isPersonalCraft:!0},"schema-weaver":{id:"schema-weaver",title:"Schema Weaver",tech:["Three.js","JavaScript","SQL Parsing"],summary:"Auto-decluttered 3D database maps.",description:"Always struggled to visualize relationships between SQL tables. So I built a tool that takes raw SQL schemas (supports TablePlus exports out of the box), smartly identifies relationships using robust heuristics based on naming conventions and foreign key patterns, and renders an [ac]auto-decluttered 3D visualization[/ac] showing which columns link which tables. A spiritual predecessor to SchemaFlow — where this one reveals structure, that one builds queries.",category:"Developer Tool • Visualization",origin:"Frustration with manual DBML conversion and relationship mapping",link:"https://themr-777.github.io/schema-weaver/",repo:"https://github.com/TheMR-777/schema-weaver",isPersonalCraft:!0,featured:!0},letitgo:{id:"letitgo",title:"LetItGo",tech:["Flutter","Dart","Local Storage","Material Design"],summary:"Minimalist elapsed time observer.",description:"Built a minimalist Android app that saves timestamps and shows elapsed time down to the second — because I wanted a beautiful way to watch time flow. I've saved my birthday, job joining date, graduation, and more. Designed with obsessive attention to UI elegance, it's a tiny app with a lot of heart — and proof that [em]depth can be found in the simplest ideas[/em].",category:"Mobile • Personal",origin:"Wanting a beautiful way to visualize the passage of time",repo:"https://github.com/TheMR-777/just_letitgo",isPersonalCraft:!0,featured:!0},"githubify-md":{  structure, algorithm, project, and learning artifact in modern C++.",link:"https://github.com/TheMR-777/MyUniversity",isOpenSource:!0,roleOpenSource:"Creator"}},Md={ace:{id:"ace",company:"ACE Money Transfer",role:"Software Engineer & AI Solutions Architect",period:"Jun 2023 — Present",location:"Remote/Hybrid",featured:!0,summary:'Channeling every skill (including polyglot and AI architecture) into transforming enterprise systems. Engineered dual masterpieces: the Employee Monitoring Suite ([ac]200% productivity boost[/ac], [hi]zero defects[/hi] at launch) and the AI-augmented Unified Reporting Engine hailed by the CEO and CTO as a [hi]"marvel of engineering"[/hi].',description:"Progressed from UI/UX to leading core platform modules and multi-tenant migration decisions. My focus: building [hi]reusable primitives[/hi] that power every business module. I also championed the adoption of [ac]AI agentic workflows[/ac] (Cursor), successfully pitching it to the C-suite and accelerating my deployment speed by [hi]100x[/hi] while focusing strictly on core architecture.",highlights:["Architected Employee Monitoring Suite solo — zero defects at launch","Engineered Evolver: chromium-inspired cross-platform auto-update engine","Designed 'ACE Password Vault' with multi-layered cryptography","Architected Overwatch: flagship status & monitoring engine with dynamic XML/JSON response criteria parsing","Led ERP Platform Engineering: Rules, Approvals, Rights, Notifications","Built unbreakable Background Jobs Framework — adopted company-wide","Engineered pluggable Logging Framework for in-depth observability","Spearheading Apple MDM Platform: .NET 10 orchestration of nanoMDM/microMDM/SCEP microservices for company-wide hardware and OS access control",'Architected Unified Reporting Engine with embedded Jupyter notebooks, Gemini AI script generation, graph-based schemas, and 3,000+ tests — praised by CEO, CTO, and Treasury as a "marvel of engineering"',"Integrated Mastercard, HBL, and PNB  modeling","ToA/TDoA localization with accuracy indicators","Five-milestone consultancy delivery: full source code, documentation, training workshop, support window","Received exceptional praise for accuracy and attention to detail"],modules:[{name:"Simulation Engine",description:"C# 13 and .NET 9 core modeling signal attenuation, reflection, and geometric constraints with high precision.",impact:"Matched physical test results within 5% margin"},{name:"Signal Processing Pipeline",description:"Python 3.13 modules using NumPy/SciPy for computational geometry and heatmap generation.",impact:"Real-time updates for large floorplans"},{name:"Visualization Layer",description:"WPF interface integrating Matplotlib for coverage analysis. Interactive anchor placement and optimization.",impact:"Intuitive UI praised by client"}],impact:["Eliminated need for initial physical site surveys","Compressed deployment timeline from months to days","Enabled 'perfect' theoretical anchor placement before installation"],tech:["C# 13",".NET 9","Python 3.13","NumPy","SciPy","WPF","Matplotlib"]},teqholic:{id:"teqholic",company:"TeqHolic",role:"Flutter Development Intern",period:"2023 (3 Months)",location:"Jhelum, Pakistan",summary:"Developed cross-platform mobile applications including social media and e-commerce platforms with real-time capabilities.",description:"Gained practical industry experience in agile development, focusing on responsive UI architectures and performance optimization for low-bandwidth environments.",highlights:["Built Chirp: Twitter-like app with real-time updates","Developed Sara Kuch: E-commerce with Shopify integration","Optimized for low-bandwidth environments"],modules:[{name:"Chirp",description:"Social media application with real-time feeds, interactions, and notifications using Firebase.",impact:"Full MVP in 6 weeks"},{name:"Sara Kuch",description:"E-commerce platform integrating Shopify REST API with cart, checkout, and order tracking.",impact:"Complete e-commerce flow delivered"}],impact:["Delivered two full MVP applications in 3 months","Established responsive UI patterns for future projects"],tech:["Flutter","Dart","Firebase","Shopify API","Provider"]}},Ak={name:"Muhammad Ammar Khan",role:"Software Architect & Security Engineer",location:"Jhelum, Punjab, Pakistan",email:"m.shahzad.ms72@gmail.com",phone:"+92 314 5401405",dob:"April 1, 2001",nationality:"Pakistani",profileImage:"https://i.ibb.co/2Y8YWR1X/freepik-br-2a5d6513-6583-40a5-8ab6-1a77d56608c6.png",taglines:["Creating What Hasn't Been Built Before","Software Architect & Security Engineer","C++ Expert & Cryptography Specialist","AI-Powered Innovation Engineer","Agentic Engineer & AI Orchestrator"],about:"A lifelong journey of innovation and engineering excellence, from age 3 to industry architect. I blend low-level mastery (C++, Cryptography) with high-level architecture (.NET, AI) to engineer solutions that haven't been built before — from enterprise platforms to open-source tools that transform how developers work.",social:{github:"https://github.com/TheMR-777",linkedin:"https://www.linkedin.com/in/777-ammar",website:"https://TheMR-777.github.io/",whatsapp:"https://wa.me/923145401405",nullbyte:"https://creator.wonderhowto.com/h4ck3r_777/"},stats:{experience:"6+ Years",productivity:"200%",cgpa:"3.73"},languages:{urdu:"Native",english:"IELTS 7.5"},interests:[{name:"Astronomy",description:"Second-largest passion after computing. I study the cosmos through expert voices to build [ac]intuition[/ac]—not rote facts—about black holes, stellar evolution, and cosmic structure."},{name:"Physics",description:"A late-blooming love that became a core lens. I build intuitive models about electromagnetism, chip fabrication, GPUs, and hardware architectures through [hi]thoughtful exploration[/hi]."},{name:"Psychology",description:"Nurtured by my psychologist mother's open conversations. I study cognitive biases, human behavior, and learning science. This directly informs my engineering: I design user-centric interfaces and cognitive models for AI agents that align with how humans naturally reason and perceive information."}]},Tk={title:"The Driving Force",subtitle:"The Joy of Discovery",mainQuote:"The scale of the goal has [hi]never[/hi] mattered to me—what matters is the [ac]journey[/ac] of getting there.",cardText:`Whether I'm architecting a comprehensive system like the [c=text-text-primary font-medium]Employee Monitoring Suite[/c], or spending hours refining something as "simple" as a prime number generation algorithm, the experience is the same: an [ac]insatiable curiosity[/ac] that drives me to discover one more micro-optimization, one more elegant simplification, one more insight I hadn't seen before.`,sections:[{title:"The Journey Over the Goal",content:"We are conditioned to optimize for the finish line, but the most profound discoveries happen in the margins. It is the obsessive iteration, the refusal to settle for 'good enough', and the relentless extraction of insights that defines true engineering.",highlight:"The destination is just a waypoint — the real reward is the infinite richness of the journey itself."},{title:"The Beauty in Fundamentals",content:"Refining basic algorithms far longer than 'reasonable' — not just to save microseconds, but to uncover the profound elegance hidden beneath simple logic. Each pass strips away the unnecessary, revealing insights that transform routine code into mathematical art.",highlight:"These aren't just technical wins — they're discoveries.",expansion:{label:"Read Discoveries",icon:"lightbulb",data:[{name:"The Zero-Branch Fibonacci",description:"I spent hours analyzing the Fibonacci sequence's core logic on paper, fundamentally bothered by the standard conditional checks for 0 and 1 that run on every single iteration.",points:["Projected the mathematical sequence backward into negative space.","Started the generation from unseen negative indices rather than zero.","This perspective shift [ac]completely eliminated[/ac] the need for conditional branching, rendering the inherent complexity entirely obsolete."]},{name:"Rediscovering Horner's Method",description:"During university, I was deeply frustrated with the heavy, repetitive calculations required for binary-to-decimal conversions, even when using standard shortcuts.",points:["Experimented and devised a personal technique: multiply the running total by 2 and add the next digit, moving left to right.","Years later, I learned I had independently derived [hi]Horner's Method[/hi] of polynomial evaluation.","This was a defining moment that deeply validated my trust in raw mathematical intuition."]}]}},{title:"Succeeding Within the Failures",content:"Sometimes the original goal remains out of reach — but the journey yields such profound techniques, insights, and connections that I never anticipated.",highlight:"Failure isn't an endpoint — it's a checkpoint where unexpected treasures reveal themselves.",expansion:{label:"View Incident",icon:"play",data:{title:"The Granite 2000000 Incident",subtitle:"July 2022 · Summer Holidays",phases:[{label:"The Blackout",content:'After three years away from gaming, I was deep into Far Cry 6 and genuinely enjoying it again. Then, mid-autosave, electricity went out. On reboot, the game showed "Error: Granite 2000000." Months of progress looked gone, and no real fix existed online.'},{label:"The Discovery",content:"Using my data recovery instincts, I inspected the save files. One autosave had the right size but only null bytes. Then I noticed each file had a numbered counterpart (_01 / _02). The counterpart had real data. I replaced the corrupted file with it and loaded the game from the exact interrupted moment."},{label:"The Ripple",content:"I validated the method repeatedly, then compressed the fix into a 40-second YouTube tutorial. It spread quickly across forums and helped players in Far Cry 5, New Dawn, and Far Cry 4 too. I still receive appreciation comments today."}],link:{url:"https://www.youtube.com/watch?v=cPH_SZKI_Cg",label:"Watch the 40-second fix"}}}},{title:"Beyond Computer Science",content:"Mathematics, Physics, Psychology — every domain is a fractal where depth is always possible, and curiosity always rewarded.",highlight:"Computer Science is only one language of discovery — every domain reveals that there is no bottom, only deeper truth.",expansion:{label:"Explore Passions",icon:"sparkles",reference:"personal.interests"}},{title:"The Discipline of Restraint",content:"True sophistication is found in what we have the courage to leave out. Whether in code, architecture, or discourse, restraint creates the necessary space for clarity to resonate. It is the silence that gives the statement its gravity.",highlight:"If everything is an accent, nothing is. Mastery lies in the deliberate choice of what to leave unsaid.",expansion:{label:"Explore the Principle",icon:"sparkles",data:[{name:"Minimalism in Engineering",description:"Every unnecessary branch, abstraction, or dependency is not just clutter — it is a hidden liability. When I ruthlessly remove what shouldn't exist, the system doesn't just get cleaner.",points:["It gets [ac]faster[/ac]. The Zero-Branch Fibonacci proved that eliminating conditionals unlocks performance no amount of optimization can achieve.","It becomes [hi]predictable[/hi]. Fewer moving parts means an exponentially smaller surface area for bugs.","Less logic is never a compromise; it acts as a powerful force multiplier for system stability."]},{name:"Restraint as a Design Language",description:"An element can only truly command attention if there is deliberate silence surrounding it. This portfolio is living proof of this thesis.",points:["Every accent color and animated detail exists within carefully curated quiet zones that amplify its impact.","The exact same principle governs code architecture.","A well-named function carries massive communicative weight only when it isn't buried in noise. [em]What you remove defines what you say.[/em]"]}]}},{title:"Learning How to Learn",content:"Not remembering facts — building connections. Relating the new to the known until it becomes [ac]intuition[/ac]. The skill that compounds across everything.",highlight:"Not learning to remember — learning to learn.",expansion:{label:"Explore the Mindset",icon:"brain",data:[{name:"The Holmesian Attic",description:"Sherlock Holmes famously compared the brain to an empty attic — a finite space that a fool clutters with random facts, while a master curates only what is essential and structurally sound.",points:["Rote memorization is merely hoarding scattered, brittle, and context-dependent facts.","True understanding means building a [ac]network of connections[/ac] anchored to existing mental models.","With this mental architecture, forgetting becomes nearly impossible — pull on one thread, and the entire web reinforces it."]},{name:"The Compounding Meta-Skill",description:"Most skills improve linearly with practice. Learning [em]how[/em] to learn is entirely different — it improves every other skill simultaneously and permanently.",points:["Internalized mental models don't stay contained; they actively cross-pollinate between domains.","A breakthrough in understanding CPU cache behavior directly sharpens intuition for UI rendering performance.","A study of cognitive bias in Psychology directly improves how I architect APIs for human operators. The meta-skill [ac]exponentially multiplies[/ac]."]}]}},{title:"Orchestrating the Machine",content:"The AI revolution automates [ac]cognitive boilerplate[/ac], just like the industrial revolution automated manual labor. An engineer's value shifts from implementation to orchestration — freeing it to obsess over true engineering — [hi]architecture[/hi], security, and UI/UX.",highlight:"When machines automate the routine, the engineer is elevated to the orchestrator.",expansion:{label:"Read Story",icon:"lightbulb",data:{title:"The 100x Acceleration Pivot",content:"At ACE Money Transfer, after a strategic campaign to convince leadership, I successfully deployed Cursor into my enterprise workflow — resulting in a massive 100x acceleration in deployment speed. But speed without standards is a liability. This required a fundamental shift in how I engineer:",points:["Shifting away from writing cognitive boilerplate to focus entirely on high-level architecture.","Maintaining an iron grip on engineering values by rigorously correcting the AI's output.","A new paradigm: not just writing raw code, but [ac]directing intelligence[/ac] to perfectly mirror intent."]}}}],principles:[{icon:"compass",title:"Beyond the Recipe",description:"I don't accept surface answers. I challenge existing implementations and build connections between ideas — until knowledge becomes intuition."},{icon:"layers",title:"Precision",description:"True mastery shows in removing what doesn't belong. I cut complexity and spot inefficiencies — small changes, disproportionate gains."},{icon:"lightbulb",title:"Adaptability",description:"Each problem deserves a solution tailored to its unique constraints, not forced generic templates."},{icon:"sparkles",title:"Evolution",description:"Making things genuinely better, not just different. Refining until the result feels inevitable."}],toolsPhilosophy:{title:"Tools That Transform",subtitle:"The distinction between storing information and creating value",content:"Most software exists to [hi]remember[/hi] — to store records, log transactions, and keep notes organized. Important work, but not what ignites my passion.",essence:"What excites me is building software that takes something [c=text-text-secondary]in[/c], and gives something [ac]genuinely new[/ac] back. Software that [ac]transforms[/ac].",examples:"Every personal project I build follows this principle. SchemaFlow transforms raw SQL DDLs into visual, interactive query canvases. Schema Weaver untangles database relationships into auto-decluttered 3D maps. The Moiré Effect Demo turns a real-world physics observation into interactive understanding. GitHubify-MD eliminates hours of broken Markdown-to-HTML conversion. Even Simple Smart Cleanup automates tedious system maintenance I'd otherwise do by hand. These are small, sometimes simple — but each one takes something in and produces something of real, tangible value.",closing:"This is the kind of engineering that matters to me: building things that actually do something. Tools that process, transform, and create — not just remember.",grid:[{verb:"Reveal",icon:"◐",description:"Making the invisible visible — uncovering hidden patterns"},{verb:"Simplify",icon:"◇",description:"Reducing complexity to clarity — distilling essence"},{verb:"Automate",icon:"↻",description:"Freeing humans from repetitive, mundane work"},{verb:"Connect",icon:"⬡",description:"Bridging isolated systems — creating synergy"},{verb:"Simulate",icon:"◈",description:"Replacing costly trials with digital insight"},{verb:"Empower",icon:"△",description:"Enabling capabilities that didn't exist before"}],mantra:{input:"Input",transformation:"Transformation",output:"Value"},closingThought:"Software worth building leaves the world different than it found it."},architecturalPhilosophy:{content:"I don't just [hi]memorize[/hi] patterns—I understand them at their core: [c=text-accent]what problem[/c] each pattern solves, [c=text-accent]how[/c] it solves it, and [c=text-accent]where it falls short[/c].",revealText1:"Patterns are the surface. Understanding is what lies beneath.",revealText2:"I don't just build systems — I build the intuition that builds systems.",revealText3:"[ac]Learn how to learn,[/ac] and everything else follows."},closingQuote:`"[i]Creating what hasn't been built before,[/i]<br/>[em]one innovation at a time.[/em]"`,coreInsight:"This is my innermost driving force. I don't pursue projects for the end result alone; I pursue them for what I'll discover along the way. It's why I can spend weeks on something others finish in hours, and why the 'simplest' problems often teach me the most.",wisdomHierarchy:{title:"The Four Levels of Knowledge",attribution:"Ancient Persian Proverb",levels:[{index:1,statement:"He who knows not, and knows not that he knows not, is a fool—shun him.",essence:"Unconscious incompetence"},{index:2,statement:"He who knows not, and knows that he knows not, is hungry—teach him.",essence:"Conscious incompetence",selfAssessment:!0},{index:3,statement:"He who knows, and knows not that he knows, is asleep—wake him.",essence:"Unconscious competence"},{index:4,statement:"He who knows, and knows that he knows, is wise—follow him.",essence:"Conscious competence",aspiration:!0}],personalReflection:"I consider myself at Level 2—hungry to learn, capable of building robust and secure systems, but deeply aware of how much more there is to know. My goal is to reach Level 4: not just knowing more, but knowing deeply enough to architect autonomous, intelligent agents that self-optimize and self-secure. The gap between these levels is precisely what drives every project, every late-night optimization, and every domain I explore."}},Mk={genesis:{title:"The Genesis",period:"Age 3-10",description:"My journey began at age 3 in Rawalpindi, shaped by my uncle's computer lab. What started with GTA Vice City and SEGA wasn't just entertainment — it planted the seed of an [ac]insatiable curiosity[/ac] about how systems work. When gifted a PC in Jhelum, limited access and geographical isolation became my greatest teachers: troubleshooting Windows XP configurations without internet or English skills turned me from a gamer into a self-taught technician."},awakening:{title:"The Awakening",period:"Teenage Years",description:"Watching 'Inkeshaaf' on 24 News ignited my passion for [ac]ethical hacking[/ac]. Lacking high-end computing resources, I set an 'impossible' goal: hack an Android from another Android using only mobile power. Over a year, I mastered Linux, Python, and shell scripting—pioneering [hi]mobile-to-mobile penetration testing[/hi]. This research became Null Byte's 2nd most-read article globally and founded a 6-country cybersecurity community."},academic:{title:"Academic Excellence",period:"2019-2023",description:"At University of the Punjab, I earned a [ac]3.73 CGPA[/ac] while pursuing depth far beyond the curriculum—implementing DSA in [hi]modern C++[/hi] a year early. Served as unofficial C++ teaching assistant from my second semester and deputy class representative managing online learning during COVID-19. First team to simultaneously ship both our Capstone project (Costaz) and two peer-reviewed research papers."},professional:{title:"Professional Evolution",period:"2023-Present",description:`My industry entry was strategic, leading to a direct selection at ACE Money Transfer. As Developer & Architecture Consultant, I've transformed enterprise systems. Alongside EMS—my solo [ac]professional masterpiece[/ac]—I architected the Unified Reporting Engine with embedded Jupyter notebooks, Gemini-powered code generation, graph schemas, and 3,000+ tests, hailed by the CEO and CTO as a [hi]"marvel of engineering"[/hi]. This transformed my vision for [hi]Intelligent Scaffolding[/hi] from concept into living enterprise reality. My medium-term focus is establishing a Pakistan-based SME Venture Studio and AI Commons to democratize trustworthy AI.`}},Ck={languages:[{name:"C++",level:"Expert",years:"6+",tags:["Modern C++23/26","Template Metaprogramming"],extraTags:["STL","SFINAE & Concepts","Lock-free Programming","Memory Management","RAII","Move Semantics"]},{name:"C# / .NET",level:"Advanced",years:"3+",tags:[".NET 9","LINQ","Async/Await"],extraTags:["Blazor","EF Core","Source Generators","Minimal APIs","SignalR"]},{name:"Python",level:"Advanced",years:"5+",tags:["FastAPI","Jupyter Kernel","Google Gemini API","Pandas"],extraTags:["Graph Schemas","Pytest (3,000+ Tests)","NumPy","SciPy","Matplotlib","ReportLab","OpenPyXL"]},{name:"T istan","India","Australia","Finland","Bangladesh"],achievements:["Grew from 2 to 13 dedicated members organically","Fostered knowledge sharing and collaborative learning globally","Recruited local students, sparking university-wide security interest","Developed innovative security testing methodologies as a group","Mentored members from beginner to intermediate security levels"]},mentorship:{sessions:"50+",studentsMentored:"20+",topics:["C++","System Design","Data Structures","Security Fundamentals","Python","Cryptography","Reverse Engineering","Social Engineering"],description:"Conducted 50+ peer programming sessions and mentored [hi]20+ students[/hi] in C++ and system design. Created educational content reaching [ac]thousands globally[/ac] through Null Byte articles and community forums."}},Ok={title:"Quantum Computing & Photonics Simulation",collaborator:"Visiting PhD Professor",institution:"University of the Punjab",duration:"2023 — 2024",collaborators:[{name:"Prof. Kamarul Hawari",affiliation:"UMPSA (Malaysia)"},{name:"Prof. Muhammad Aamir Khan",affiliation:"University of Oxford (UK)"},{name:"Research Assoc. Sundas Naqeeb Khan",affiliation:"Silesian University of Technology (Poland)"}],description:"Collaborated with a visiting PhD professor specializing in quantum computing, within an international research team spanning SUT (Poland), Oxford (UK), and UMPSA (Malaysia). This relationship became a vital bridge between theoretical academia and practical research. I delivered high-fidelity C++, Python, and MATLAB prototypes for mirror-array and emitter-detector setups, while she coached me on framing hypotheses and writing for publications. We maintained a steady communication channel even after her relocation to Poland, a bidirectional mentorship that directly raised the bar for my subsequent indoor positioning simulation for MIMOS Berhad.",contributions:["Developed C++, Python, and MATLAB prototypes for quantum optics simulation","Modeled quantum phenomena, photon behavior, and mirror-array emitter-detector setups","Built a fully-documented Mach-Zehnder Interferometer simulation in Julia + QuantumOptics.jl — second-quantised modeling across four progressive variants, each with runnable code and written explanation","Designed and delivered a pulse-laser simulation system for the team — Julia scientific backend (standalone CLI-usable by design) with a C#/WPF frontend — to the appreciation of the professor and researchers","Maintained steady research cadence and WhatsApp communication post-relocation to Poland","Bidirectional mentorship: traded programming prototypes for academic writing coaching","Directly informed the high-precision computational physics modeling used later for MIMOS Berhad"]},jv=[{target:"ACE HRMS (Laravel-based)",severity:"Critical",description:"Identified a vulnerability that allowed unauthorized access to any employee profile, including executives. Responsibly disclosed and promptly patched.",type:"Broken Access Control"},{target:"ACE Internal Ticketing System",severity:"High",description:"Discovered a flaw in file attachment handling allowing unauthorized download of sensitive documents including financial reports and complaints. Reported to CTO and patched immediately.",type:"Insecure Direct Object Reference"},{target:"CyberMACS Subscription Portal",severity:"Medium",description:"While applying, identified PHP error messages exposing server paths and database details. Wrote a detailed ethical disclosure email to the CyberMACS team, demonstrating proactive security mindset even as an applicant.",type:"Information Exposure"}],Sv={overview:{quote:"Creating what hasn't been built before, [dt]one innovation at a time.[/dt]",nudge:"Read my philosophy",target:"philosophy"},skills:{quote:"Every skill listed here was forged in the fire of real systems — [dt]not only through tutorials.[/dt]",nudge:"See where these skills were tested",target:"experience"},projects:{quote:"Behind every project here lies a delibera ull year before formal coursework, implemented every fundamental data structure and algorithm in [hi]modern C++[/hi] — proper OOP with RAII, move semantics, and STL-style interfaces. Benchmarked against reference implementations.",linkTarget:{tab:"skills",section:"skills-dsa"},linkLabel:"View DSA details"}]},{id:"community-open-source",title:"Community & Open Source",subtitle:"Building bridges across borders",icon:"gitBranch",items:[{title:"Open Source Contributions",badge:"4 Projects",badgeVariant:"accent",description:"Active contributor to [hi]AvaloniaUI[/hi] (performance optimizations), [hi]Flutter[/hi] (architecture improvements), [hi]fluent_ui[/hi] (component development), and creator of [ac]mr_crypt[/ac] and [ac]MyUniversity[/ac].",linkTarget:{tab:"about",section:"about-community"},linkLabel:"View contributions"},{title:"Mentorship & Knowledge Sharing",badge:"50+ Sessions",badgeVariant:"muted",description:"Conducted 50+ peer programming sessions and mentored 20+ students in C++ and system design. Created educational content reaching [ac]thousands globally[/ac] through Null Byte and community forums."},{title:"IELTS Academic — Band 7.5",badge:"British Council",badgeVariant:"muted",description:"Listening: 8.5, Reading: 7.0, Writing: 7.0, Speaking: 7.0 — demonstrating strong English proficiency for international academic and professional communication."}]}],milestones:[{title:"ARMA II NPC Traffic Module",period:"Early Teenage Years",description:"Decompiled and rebuilt an ARMA II module to embed custom NPC traffic scripts, creating an organic sandbox environment. Successfully repackaged and integrated it — running flawlessly on the first launch.",significance:"First contact with reverse-engineering and binary-level thinking — a formative experience that foreshadowed the security and systems architecture career.",icon:"gamepad"},{title:"Intelligent Scaffolding: Vision to Reality",period:"2024 — Shipped in Production",description:"Originally formulated as an architectural vision to translate conversational queries into deterministic code modules, I successfully realized this paradigm in enterprise production within the Reporting Engine: empowering users with Google Gemini AI code generation, embedded Jupyter notebook execution, and graph schema inheritance.",significance:"Brought an ambitious AI architectural thesis into live enterprise production — proving that the engineer can orchestrate autonomous intelligence with uncompromising reliability.",icon:"brain"},{title:"AI-Driven Monitoring Proposal",period:"2024",description:"Proposed an AI-driven evolution of the Employee Monitoring Suite to automate worklogging and reduce human interference. Technical leadership validated the architecture — fueling the desire to pursue AI in a research-oriented environment.",significance:"Demonstrated initiative to push beyond the status quo and validated that the AI vision had real architectural merit.",icon:"sparkles"}],trajectory:{title:"The Trajectory",core:"I envision AI not as a tool for incremental productivity gains, but as the foundation for [ac]societal transformation[/ac] — a future where AI handles all necessary work, freeing humanity to pursue passions, creativity, and voluntary contribution.",pillars:[{name:"Open-Source Ethos",description:"People contribute voluntarily because they want to, not because they must to survive."},{name:"Breaking Exploitative Cycles",description:"AI can break the cycles where humans exploit each other through economic necessity and survival pressures."},{name:"Passion Over Desperation",description:"Building toward a world where technology eliminates coerced labor and humans contribute out of passion."}],entrepreneurVision:{title:"SME Venture Studio & AI Commons",description:"Medium-term vision of establishing a Pakistan-based SME Venture Studio — working collaboratively with startups in a family-like, non-greedy relationship. Also envisions an AI Commons to democratize trustworthy AI."}}},_k={armaModding:{title:"ARMA II NPC Traffic Module",period:"Early Teenage Years",tech:["SQF Scripting","Decompilation","Game Modding","File System"],summary:"Decompiled and rebuilt ARMA II module to embed custom NPC traffic scripts, creating an organic sandbox environment.",description:"Frustrated by the manual setup needed for every custom mission, decompiled a packaged game addon, reverse-engineered its source code, and refactored the bindings to embed a custom-written GTA-like traffic script. Successfully repackaged and integrated it into the game's world editor, running flawlessly on the first launch. This early triumph sparked my lifelong fascination with reverse-engineering and systems modding.",significance:"First contact with reverse-engineering and binary-level thinking — a formative experience that foreshadowed the security and systems architecture career."},intelligentScaffolding:{title:"Intelligent Scaffolding: Vision to Reality",period:"2024 — Realized in Production",tech:["LLM Code Generation","Google Gemini API","Jupyter Kernel","Graph Schemas","Pytest (3,000+ Tests)"],summary:"Deep architectural paradigm bridging conversational requests with deterministic enterprise systems — successfully materialized in the ACE Reporting Engine.",description:"Born from daily customer sessions at ACE where unique client requests spawned weeks of deterministic coding. Proposed an ambitious solution: an AI agent that accepts conversational queries, dynamically generates, reviews, and executes deterministic code, and registers it as a reusable module. Successfully delivered this paradigm into production through the ERP Reporting Engine — integrating Google Gemini endpoints for on-the-fly Python script generation inside an embedded Jupyter notebook runtime, backed by graph schema inheritance and 3,000+ automated test cases.",wisdomMapping:"A concrete step along the ladder: from Level 2 (building robust deterministic systems) toward Level 4 (architecting self-optimizing, self-securing systems). The Reporting Engine is the furthest I have climbed — not the summit, and I do not claim to have arrived.",significance:"The living bridge between enterprise data engineering and the AI-first future — turning the engineer into the orchestrator and earning highest praise from the CEO and CTO."},aiDrivenMonitoring:{title:"AI-Driven Employee Monitoring Proposal",period:"2024",description:"At ACE, proposed an AI-driven evolution of the Employee Monitoring Suite to automate worklogging and reduce human interference — eliminating the trust issues that manual monitoring creates. Developed the plan with a fellow colleague and presented to the CTO, who fully supported the architecture. However, commercial pressures redirected focus to ERP development, and the opportunity never materialized. This fueled the desire to pursue AI in a more research-oriented environment.",significance:"Demonstrated initiative to push beyond the status quo and validated that the AI vision had real architectural merit."}},Lk={title:"Vision for AI-Driven Society",core:"I envision AI not as a tool for incremental productivity gains, but as the foundation for societal transformation — a future where AI handles all necessary work, freeing humanity to pursue passions, creativity, and voluntary contribution.",pillars:[{name:"Open-Source Ethos",description:"People contribute voluntarily because they want to, not because they must to survive. Open source will ultimately prevail as the dominant model when survival is decoupled from labor."},{name:"Breaking Exploitative Cycles",description:"Not just technical challenges, but how humans exploit each other through economic necessity, how survival pressures create harmful hierarchies, and how AI can break these cycles."},{name:"Passion Over Desperation",description:"Building toward a world where technology eliminates coerced labor, where humans contribute out of passion rather than desperation, and where we can focus on solving humanity's self-inflicted challenges."}],inspiration:"Inspired by thinkers like Elon Musk who articulate similar visions, and aiming to contribute — however incrementally — to building systems that move us toward this future.",childhoodCuriosity:"Since childhood, I've wondered how to make computers 'think.' Whenever I designed a system, I always considered: what would happen if it were truly intelligent? Not with lots of if-statements, but genuinely intelligent. This curiosity drove me to explore AI not just as a tool, but as a fundamental shift in computing."},Bk=[{name:"Self-Taught Problem Solver",description:"Learning independently since childhood"},{name:"Systems Thinker",description:"Seeing connections across diverse domains"},{name:"Innovation Driver",description:"Consistently pushing boundaries of what's possible"},{name:"Knowledge Synthesizer",description:"Combining diverse fields for novel solutions"},{name:"Community Builder",description:"Creating and nurturing technical communities"},{name:"Continuous Learner",description:"Treating every challenge as a growth opportunity"},{name:"Obsessive Documenter",description:"Deep passion for documenting every learning journey; GitHub serves as a comprehensive knowledge repository — nothing learned goes undocumented"}],Pk={rev9Leverage:{title:"Rev9 Solutions Leverage",description:"Before ACE, was offered a position on Rev9 Solutions' AI team. Used this as strategic leverage during negotiations, ultimately choosing ACE for financial stability and enterprise-scale growth opportunities.",significance:"Demonstrated strategic career decision-making and validated AI-readiness even at the start of professional career."},entrepreneurVision:{title:"SME Venture Studio & AI Commons",description:"Medium-term vision of establishing a Pakistan-based SME Venture Studio to help smaller firms — working collaboratively with startups in a family-like, non-greedy relationship. Also envisions an AI Commons to democratize trustworthy AI, removing the barrie
